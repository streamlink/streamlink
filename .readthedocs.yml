version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      - "[ ${READTHEDOCS_VERSION_TYPE} = external ] || exit 183"
      - bash ./.github/workflows/scripts/fetch-tags.sh
      - git describe --tags --long --dirty

python:
  install:
    - method: uv
      command: sync
      extras: all
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
